<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Usia Presisi | KenzoVerse Tools</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-body: #0b0f19;
      --bg-surface: rgba(21, 29, 42, 0.75);
      --bg-input: rgba(9, 13, 22, 0.8);
      --border: rgba(255, 255, 255, 0.1);
      --border-focus: #38bdf8;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      
      --error: #ef4444;
      --radius: 20px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Ambient Glow */
    body::before {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      background: var(--accent-gradient);
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(120px);
      opacity: 0.25;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
    }

    input[type="date"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: all 0.25s ease;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-calc {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent-gradient);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-calc:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    }

    .btn-calc:active {
      transform: translateY(0);
    }

    .error-msg {
      font-size: 0.8rem;
      color: var(--error);
      display: none;
      text-align: center;
      animation: fadeIn 0.2s ease;
    }

    /* Result Section */
    .results-container {
      display: none;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
      animation: fadeInUp 0.4s ease forwards;
    }

    .age-main-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .stats-list {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .stat-row-label {
      color: var(--text-muted);
    }

    .stat-row-value {
      font-weight: 700;
      color: var(--text-main);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .container { padding: 24px 20px; }
      .stat-value { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-badge"><span>⏳</span> Utilities</div>
      <h2>Kalkulator Usia</h2>
      <p>Hitung detail usia presisi dan hari lahirmu</p>
    </div>

    <div class="form-group">
      <label for="birthday">Pilih Tanggal Lahir</label>
      <div class="input-wrapper">
        <input type="date" id="birthday" onkeydown="handleKeyPress(event)">
      </div>
      <div class="error-msg" id="errorMsg">Silakan pilih tanggal lahir yang valid</div>
    </div>

    <button class="btn-calc" onclick="calculateAge()">
      <span>Hitung Usia</span>
      <span>&rarr;</span>
    </button>

    <!-- Results Display -->
    <div class="results-container" id="resultsView">
      <div class="age-main-grid">
        <div class="stat-card">
          <div class="stat-value" id="resYears">0</div>
          <div class="stat-label">Tahun</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="resMonths">0</div>
          <div class="stat-label">Bulan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="resDays">0</div>
          <div class="stat-label">Hari</div>
        </div>
      </div>

      <div class="stats-list">
        <div class="stat-row">
          <span class="stat-row-label">Hari Kelahiran</span>
          <span class="stat-row-value" id="resDayName">-</span>
        </div>
        <div class="stat-row">
          <span class="stat-row-label">Total Hari Hidup</span>
          <span class="stat-row-value" id="resTotalDays">-</span>
        </div>
        <div class="stat-row">
          <span class="stat-row-label">Ulang Tahun Berikutnya</span>
          <span class="stat-row-value" id="resNextBday">-</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Web Audio API Synth for Interactive UI Sound
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAudioFX() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.frequency.setValueAtTime(520, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        calculateAge();
      }
    }

    function calculateAge() {
      playAudioFX();
      
      const birthdayInput = document.getElementById("birthday");
      const errorMsg = document.getElementById("errorMsg");
      const resultsView = document.getElementById("resultsView");
      
      if (!birthdayInput.value) {
        showError("Silakan pilih tanggal lahir Anda");
        return;
      }

      const birthDate = new Date(birthdayInput.value);
      const today = new Date();

      if (birthDate > today) {
        showError("Tanggal lahir tidak boleh di masa depan");
        return;
      }

      hideError();

      // Precise Age Calculation
      let years = today.getFullYear() - birthDate.getFullYear();
      let months = today.getMonth() - birthDate.getMonth();
      let days = today.getDate() - birthDate.getDate();

      if (days < 0) {
        months--;
        const prevMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      // Day Name
      const dayNames = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const birthDayName = dayNames[birthDate.getDay()];

      // Total Days
      const totalDaysLived = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));

      // Days until next birthday
      let nextBday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
      if (today > nextBday) {
        nextBday.setFullYear(today.getFullYear() + 1);
      }
      const daysToNextBday = Math.ceil((nextBday - today) / (1000 * 60 * 60 * 24));

      // Render UI
      document.getElementById("resYears").textContent = years;
      document.getElementById("resMonths").textContent = months;
      document.getElementById("resDays").textContent = days;
      document.getElementById("resDayName").textContent = birthDayName;
      document.getElementById("resTotalDays").textContent = totalDaysLived.toLocaleString('id-ID') + " Hari";
      document.getElementById("resNextBday").textContent = daysToNextBday === 0 ? "Hari Ini! 🎉" : daysToNextBday + " Hari lagi";

      resultsView.style.display = "flex";
    }

    function showError(msg) {
      const errorMsg = document.getElementById("errorMsg");
      const resultsView = document.getElementById("resultsView");
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
      resultsView.style.display = "none";
    }

    function hideError() {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.style.display = "none";
    }
  </script>
</body>
</html>
