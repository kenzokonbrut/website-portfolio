<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQC (iPhone Quote Chat) Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            margin: 0;
            color: #4da6ff;
            text-align: center;
            font-size: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #aaa;
        }

        textarea, input[type="text"] {
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        input[type="file"] {
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #444;
            color: white;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }

        .row {
            display: flex;
            gap: 15px;
        }
        .row > div {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }

        button {
            background-color: #4da6ff;
            color: #121212;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #3b82cc;
        }

        .preview-container {
            width: 100%;
            border: 1px solid #444;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IQC Chat Generator</h1>
        
        <div class="input-group">
            <label for="quoteText">Teks Kutipan / Pesan:</label>
            <textarea id="quoteText">"Jika hari ini belum berhasil, bukan berarti impianmu telah berakhir. kegagalan itu sebuah pelajaran bukan berakhirnya sebuah harapan"</textarea>
        </div>

        <div class="row">
            <div class="input-group">
                <label for="timeText">Waktu (Jam):</label>
                <input type="text" id="timeText" value="05:54">
            </div>
            <div class="input-group">
                <label for="providerText">Nama Provider:</label>
                <input type="text" id="providerText" value="INDOSAT LTE">
            </div>
        </div>

        <div class="input-group">
            <label for="bgUpload">Upload Background (Opsional):</label>
            <input type="file" id="bgUpload" accept="image/*">
        </div>

        <div class="input-group">
            <label for="blurAmount">Tingkat Blur Background:</label>
            <input type="range" id="blurAmount" min="0" max="30" value="10">
        </div>

        <label class="checkbox-group">
            <input type="checkbox" id="showReactions" checked>
            Tampilkan Baris Reaksi (👍 ❤️ 😂 😮 😢 🙏)
        </label>

        <label class="checkbox-group">
            <input type="checkbox" id="showMenu" checked>
            Tampilkan Menu Opsi (Balas, Salin, Hapus, dll)
        </label>

        <button id="downloadBtn">Unduh Gambar (Resolusi Tinggi)</button>

        <div class="preview-container">
            <canvas id="iqcCanvas" width="1080" height="1920"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('iqcCanvas');
        const ctx = canvas.getContext('2d');
        
        const quoteText = document.getElementById('quoteText');
        const timeText = document.getElementById('timeText');
        const providerText = document.getElementById('providerText');
        const showReactions = document.getElementById('showReactions');
        const showMenu = document.getElementById('showMenu');
        const downloadBtn = document.getElementById('downloadBtn');
        const bgUpload = document.getElementById('bgUpload');
        const blurAmount = document.getElementById('blurAmount');

        let bgImage = null;

        bgUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        bgImage = img;
                        draw();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;
            let linesRendered = 0;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                    linesRendered++;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            linesRendered++;
            return linesRendered * lineHeight;
        }

        function draw() {
            // 1. Latar Belakang Dasar
            if (bgImage) {
                // Efek Blur pada Gambar
                ctx.filter = `blur(${blurAmount.value}px)`;
                
                // Kalkulasi aspect ratio agar pas (cover)
                const scale = Math.max(canvas.width / bgImage.width, canvas.height / bgImage.height);
                const x = (canvas.width / 2) - (bgImage.width / 2) * scale;
                const y = (canvas.height / 2) - (bgImage.height / 2) * scale;
                
                ctx.drawImage(bgImage, x, y, bgImage.width * scale, bgImage.height * scale);
                
                // Reset filter agar elemen lain tidak ikut blur
                ctx.filter = 'none';
                
                // Tambahkan overlay gelap transparan
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#0a0a0c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#10141a');
                gradient.addColorStop(1, '#05070a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Status Bar (Atas)
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px -apple-system, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`ıll ${providerText.value}`, 60, 60);
            ctx.textAlign = 'center';
            ctx.fillText(timeText.value, canvas.width / 2, 60);
            ctx.textAlign = 'right';
            ctx.fillText('66% 🔋', canvas.width - 60, 60);

            let currentY = 300; 
            const startX = 60;  

            // 3. Baris Reaksi
            if (showReactions.checked) {
                ctx.fillStyle = '#262628';
                roundRect(ctx, startX, currentY, 700, 110, 55);
                ctx.font = '65px sans-serif';
                ctx.textAlign = 'left';
                const emojis = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
                let emojiX = startX + 50;
                for (let e of emojis) {
                    ctx.fillText(e, emojiX, currentY + 55);
                    emojiX += 105;
                }
                currentY += 130; 
            }

            // 4. Kotak Chat
            const chatWidth = 850;
            ctx.font = '45px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            
            const lineHeight = 60;
            const textPadding = 50;
            const maxWidth = chatWidth - (textPadding * 2);
            
            let tempLine = '';
            let lineCount = 1;
            const words = quoteText.value.split(' ');
            for (let n = 0; n < words.length; n++) {
                const testLine = tempLine + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    tempLine = words[n] + ' ';
                    lineCount++;
                } else {
                    tempLine = testLine;
                }
            }
            const totalTextHeight = lineCount * lineHeight;
            const chatHeight = totalTextHeight + (textPadding * 2) + 40;

            ctx.fillStyle = '#262628';
            roundRect(ctx, startX, currentY, chatWidth, chatHeight, 25);
            
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            wrapText(ctx, quoteText.value, startX + textPadding, currentY + textPadding, maxWidth, lineHeight);

            ctx.font = '28px -apple-system, sans-serif';
            ctx.fillStyle = '#999999';
            ctx.textAlign = 'right';
            ctx.fillText(timeText.value, startX + chatWidth - 30, currentY + chatHeight - 45);

            currentY += chatHeight + 20;

            // 5. Menu Konteks
            if (showMenu.checked) {
                const menuWidth = 600;
                const menuItems = [
                    { text: 'Beri Bintang', icon: '☆' },
                    { text: 'Balas', icon: '↩' },
                    { text: 'Teruskan', icon: '↪' },
                    { text: 'Salin', icon: '📄' },
                    { text: 'Ucapkan', icon: '💬' },
                    { text: 'Laporkan', icon: '⚠' },
                    { text: 'Hapus', icon: '🗑', isRed: true }
                ];
                
                const itemHeight = 90;
                const menuHeight = menuItems.length * itemHeight;

                ctx.fillStyle = 'rgba(40, 40, 45, 0.9)'; 
                roundRect(ctx, startX, currentY, menuWidth, menuHeight, 30);
                ctx.textBaseline = 'middle';
                
                for (let i = 0; i < menuItems.length; i++) {
                    const item = menuItems[i];
                    const itemY = currentY + (i * itemHeight) + (itemHeight / 2);

                    if (i > 0) {
                        ctx.beginPath();
                        ctx.moveTo(startX, currentY + (i * itemHeight));
                        ctx.lineTo(startX + menuWidth, currentY + (i * itemHeight));
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    ctx.font = '38px -apple-system, sans-serif';
                    ctx.fillStyle = item.isRed ? '#ff453a' : '#ffffff';
                    ctx.textAlign = 'left';
                    ctx.fillText(item.text, startX + 40, itemY);

                    ctx.textAlign = 'right';
                    ctx.font = '38px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.fillText(item.icon, startX + menuWidth - 40, itemY);
                }
            }
        }

        quoteText.addEventListener('input', draw);
        timeText.addEventListener('input', draw);
        providerText.addEventListener('input', draw);
        showReactions.addEventListener('change', draw);
        showMenu.addEventListener('change', draw);
        blurAmount.addEventListener('input', draw);

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `IQC_Quote_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });

        setTimeout(draw, 100);
    </script>
</body>
</html>
