<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Portal | Kenzo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(19, 26, 41, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f87171;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.1) 0%, transparent 40%);
        }

        .hidden { display: none !important; }

        /* --- AUTH CARD --- */
        .auth-container {
            width: 100%; max-width: 440px; padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .brand-header {
            text-align: center; margin-bottom: 28px;
        }

        .brand-logo {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 14px; display: inline-flex;
            align-items: center; justify-content: center;
            font-weight: 800; font-size: 22px; color: #fff; margin-bottom: 12px;
        }

        .tabs {
            display: flex; background: rgba(0,0,0,0.3);
            border-radius: 12px; padding: 4px; margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1; padding: 10px; border: none; background: transparent;
            color: var(--text-muted); font-weight: 600; font-size: 0.85rem;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1); color: #fff;
        }

        .btn-google {
            width: 100%; padding: 12px;
            background: #ffffff; color: #0f172a;
            border: none; border-radius: 12px; font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: 0.2s; margin-bottom: 20px;
        }

        .btn-google:hover { background: #f1f5f9; }

        .divider {
            display: flex; align-items: center; text-align: center;
            color: var(--text-muted); font-size: 0.75rem; margin-bottom: 20px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--border);
        }
        .divider span { padding: 0 10px; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;
        }
        .input-group input {
            width: 100%; padding: 12px 14px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border); border-radius: 10px; color: #fff;
            font-size: 0.9rem; outline: none; transition: 0.2s;
        }
        .input-group input:focus { border-color: var(--accent-blue); }

        .btn-submit {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none; border-radius: 10px; color: #fff; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.9; }

        .error-msg {
            color: var(--danger); font-size: 0.8rem; text-align: center;
            margin-top: 12px; min-height: 18px;
        }

        /* --- DASHBOARD & PROFILE VIEW --- */
        .app-container {
            width: 100%; max-width: 1000px; padding: 30px 20px;
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border); padding: 12px 24px; border-radius: 100px;
            margin-bottom: 30px;
        }

        .user-pill {
            display: flex; align-items: center; gap: 12px;
        }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--accent-blue);
        }

        .btn-logout {
            background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--danger); padding: 8px 16px; border-radius: 100px;
            cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: 0.2s;
        }
        .btn-logout:hover { background: rgba(248, 113, 113, 0.2); }

        .profile-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 28px; margin-bottom: 30px;
            display: flex; align-items: center; gap: 24px;
        }

        .profile-card img {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent-purple);
        }

        .profile-info h2 { font-size: 1.4rem; font-weight: 700; }
        .profile-info p { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }
        .badge-provider {
            display: inline-block; padding: 2px 10px; background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue); border-radius: 20px; font-size: 0.75rem;
            font-weight: 700; margin-top: 8px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- 1. AUTHENTICATION SECTION -->
    <div id="auth-view" class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <div class="brand-logo">K</div>
                <h2 id="auth-title">Selamat Datang</h2>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="tab-login">Login</button>
                <button class="tab-btn" id="tab-signup">Sign Up</button>
            </div>

            <button class="btn-google" id="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Lanjutkan dengan Google
            </button>

            <div class="divider"><span>ATAU</span></div>

            <form id="auth-form">
                <div class="input-group hidden" id="group-name">
                    <label>Nama Lengkap</label>
                    <input type="text" id="input-name" placeholder="Kenzo">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="input-email" placeholder="nama@email.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="input-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-submit">Masuk</button>
            </form>

            <div class="error-msg" id="error-msg"></div>
        </div>
    </div>

    <!-- 2. DASHBOARD & PROFILE SECTION -->
    <div id="dashboard-view" class="app-container hidden">
        <nav>
            <div class="user-pill">
                <img src="" id="nav-avatar" class="user-avatar" alt="User">
                <span id="nav-name" style="font-weight: 700;">Loading...</span>
            </div>
            <button class="btn-logout" id="btn-logout">Keluar</button>
        </nav>

        <!-- Profile Card -->
        <div class="profile-card">
            <img src="" id="profile-img" alt="Avatar">
            <div class="profile-info">
                <h2 id="profile-name">-</h2>
                <p id="profile-email">-</p>
                <span class="badge-provider" id="profile-provider">Email & Password</span>
            </div>
        </div>

        <h3 style="margin-bottom: 16px;">Portofolio & Project Akses</h3>
        <p style="color: var(--text-muted); line-height: 1.6;">
            Selamat datang di area privat. Akun Anda telah terverifikasi secara aman menggunakan otentikasi terenkripsi.
        </p>
    </div>

    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged,
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ GANTI DENGAN FIREBASE CONFIG ANDA DARI FIREBASE CONSOLE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Elements
        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const groupName = document.getElementById('group-name');
        const btnSubmit = document.getElementById('btn-submit');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');
        
        let isLoginState = true;

        // Toggle Tabs
        tabLogin.addEventListener('click', () => {
            isLoginState = true;
            tabLogin.classList.add('active'); tabSignup.classList.remove('active');
            groupName.classList.add('hidden'); btnSubmit.textContent = "Masuk";
            errorMsg.textContent = "";
        });

        tabSignup.addEventListener('click', () => {
            isLoginState = false;
            tabSignup.classList.add('active'); tabLogin.classList.remove('active');
            groupName.classList.remove('hidden'); btnSubmit.textContent = "Daftar Akun";
            errorMsg.textContent = "";
        });

        // Email/Password Submit Handler
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = "";
            const email = document.getElementById('input-email').value;
            const password = document.getElementById('input-password').value;
            const name = document.getElementById('input-name').value;

            try {
                if (isLoginState) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName: name });
                }
            } catch (err) {
                errorMsg.textContent = err.message.replace("Firebase: ", "");
            }
        });

        // Google Sign In Handler
        document.getElementById('btn-google').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (err) {
                errorMsg.textContent = err.message.replace("Firebase: ", "");
            }
        });

        // Logout Handler
        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // Realtime Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User logged in
                authView.classList.add('hidden');
                dashboardView.classList.remove('hidden');

                const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || user.email)}&background=38bdf8&color=fff`;

                document.getElementById('nav-avatar').src = user.photoURL || defaultAvatar;
                document.getElementById('profile-img').src = user.photoURL || defaultAvatar;
                document.getElementById('nav-name').textContent = user.displayName || 'User';
                document.getElementById('profile-name').textContent = user.displayName || 'User Executive';
                document.getElementById('profile-email').textContent = user.email;
                document.getElementById('profile-provider').textContent = user.providerData[0]?.providerId === 'google.com' ? 'Google Account' : 'Email & Password';
            } else {
                // User logged out
                dashboardView.classList.add('hidden');
                authView.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
