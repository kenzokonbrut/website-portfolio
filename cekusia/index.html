<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Usia</title>
    <style>
      html, body, :root {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      .container {
        display: flex;
        flex-flow: column;
        gap: 10px;
        border: 1px solid black;
        margin: 0 auto;
        padding: 16px;
        width: 500px;
      }
      #birthday {
        padding: 16px;
        font-size: 18px;
      }
      #check-button {
        padding: 12px;
        background-color: #333333;
        color: white;
        cursor: pointer;
        font-size: 18px;
      }
      #check-button:hover {
        background-color: black;
      }
      label {
        font-size: 18px;
      }
      .result {
        font-size: 18px;
        color: red;
        margin-top: 16px;
      }
      
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Cek Usia Anda</h2>
      <label>masukan tahun kelahiran anda</label>
      <input type="number" placeholder="contoh: 1945" id="birthday"/>
      <button id="check-button" onclick="checkResult()">Cek Usia</button>
      <p class="result" id="resultView"></p>
    </div>
    
    <script>
      
      function checkResult() {
        const birthdayInput = document.getElementById("birthday");
        const birthday = birthdayInput.value;
        const resultView = document.getElementById("resultView");
        
        if (!birthday) {
          resultView.textContent = "Masukkan tahun lahir dulu";
          return;
        }
        
        const now = new Date().getFullYear();
        if (birthday > now) {
          resultView.textContent = "Tahun lahir tidak valid";
          return;
        }
        const age = now - birthday;
        
        resultView.textContent = "Usia anda saat ini adalah " + age + " tahun";
      }
      
    </script>
  </body>
</html>
