<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Usia Simple</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --error: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .error-text {
      font-size: 0.8rem;
      color: var(--error);
      display: none;
      text-align: center;
    }

    /* Result Cards */
    .result-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    .result-box {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }

    .result-number {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .result-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Cek Usia</h1>
      <p>Hitung detail usia presisi dari tanggal lahirmu.</p>
    </div>

    <div class="form-group">
      <label for="birthdate">Tanggal Lahir</label>
      <input type="date" id="birthdate">
      <span class="error-text" id="errorMsg"></span>
    </div>

    <button onclick="calculateAge()">Hitung Usia</button>

    <div class="result-grid" id="resultGrid">
      <div class="result-box">
        <div class="result-number" id="years">0</div>
        <div class="result-label">Tahun</div>
      </div>
      <div class="result-box">
        <div class="result-number" id="months">0</div>
        <div class="result-label">Bulan</div>
      </div>
      <div class="result-box">
        <div class="result-number" id="days">0</div>
        <div class="result-label">Hari</div>
      </div>
    </div>
  </div>

  <script>
    function calculateAge() {
      const input = document.getElementById('birthdate').value;
      const errorEl = document.getElementById('errorMsg');
      const resultGrid = document.getElementById('resultGrid');

      if (!input) {
        showError('Pilih tanggal lahir terlebih dahulu');
        return;
      }

      const birthDate = new Date(input);
      const today = new Date();

      if (birthDate > today) {
        showError('Tanggal lahir tidak boleh di masa depan');
        return;
      }

      hideError();

      let years = today.getFullYear() - birthDate.getFullYear();
      let months = today.getMonth() - birthDate.getMonth();
      let days = today.getDate() - birthDate.getDate();

      if (days < 0) {
        months--;
        const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += lastMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById('years').textContent = years;
      document.getElementById('months').textContent = months;
      document.getElementById('days').textContent = days;

      resultGrid.style.display = 'grid';
    }

    function showError(msg) {
      const errorEl = document.getElementById('errorMsg');
      const resultGrid = document.getElementById('resultGrid');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      resultGrid.style.display = 'none';
    }

    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }
  </script>

</body>
</html>
