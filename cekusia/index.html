<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Usia</title>
    <style>
      body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
  font-family: Arial, sans-serif;
}

.container {
  width: 90%;
  max-width: 500px;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#birthday {
  padding: 14px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

#check-button {
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #667eea;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#check-button:hover {
  opacity: 0.9;
      }
      
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Cek Usia Anda</h2>
      <label>masukan tahun kelahiran anda</label>
      <input type="number" placeholder="contoh: 1945" id="birthday"/>
      <button id="check-button" onclick="checkResult()">Cek Usia</button>
      <p class="result" id="resultView"></p>
    </div>
    
    <script>
      
      function checkResult() {
        const birthdayInput = document.getElementById("birthday");
        const birthday = birthdayInput.value;
        const resultView = document.getElementById("resultView");
        
        if (!birthday) {
          resultView.textContent = "Masukkan tahun lahir dulu";
          return;
        }
        
        const now = new Date().getFullYear();
        if (birthday > now) {
          resultView.textContent = "Tahun lahir tidak valid";
          return;
        }
        const age = now - birthday;
        
        resultView.textContent = "Usia anda saat ini adalah " + age + " tahun";
      }
      
    </script>
  </body>
</html>
