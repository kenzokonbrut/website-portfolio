<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Usia</title>
    <style>
      body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  overflow: hidden;
}

/* efek blur background */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, rgba(255,255,255,0.15), transparent 60%);
}

.container {
  position: relative;
  width: 90%;
  max-width: 420px;

  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);

  display: flex;
  flex-direction: column;
  gap: 14px;

  color: white;
}

h2 {
  margin: 0;
  font-size: 22px;
}

label {
  font-size: 14px;
  opacity: 0.9;
}

#birthday {
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  outline: none;
}

#check-button {
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #ffffff;
  color: #333;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

#check-button:hover {
  transform: scale(1.03);
  background: #f0f0f0;
}

.result {
  margin-top: 10px;
  font-size: 16px;
      }
      
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Cek Usia Anda</h2>
      <label>masukan tahun kelahiran anda</label>
      <input type="number" placeholder="contoh: 1945" id="birthday"/>
      <button id="check-button" onclick="checkResult()">Cek Usia</button>
      <p class="result" id="resultView"></p>
    </div>
    
    <script>
      
      function checkResult() {
        const birthdayInput = document.getElementById("birthday");
        const birthday = birthdayInput.value;
        const resultView = document.getElementById("resultView");
        
        if (!birthday) {
          resultView.textContent = "Masukkan tahun lahir dulu";
          return;
        }
        
        const now = new Date().getFullYear();
        if (birthday > now) {
          resultView.textContent = "Tahun lahir tidak valid";
          return;
        }
        const age = now - birthday;
        
        resultView.textContent = "Usia anda saat ini adalah " + age + " tahun";
      }
      
    </script>
  </body>
</html>
