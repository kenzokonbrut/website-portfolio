<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Usia Presisi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f17;
      --surface: #111827;
      --surface-subtle: #1f293d;
      --border: #1f2937;
      --border-focus: #4f46e5;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-green: #10b981;
      --error: #ef4444;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .app-card {
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 4px 10px;
      border-radius: 99px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
    }

    /* Inputs Segment */
    .input-group-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .date-inputs {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1.2fr;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    /* Button */
    .btn-submit {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 13px 20px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Output Dashboard */
    .dashboard {
      display: none;
      flex-direction: column;
      gap: 20px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      animation: fadeIn 0.25s ease-out;
    }

    /* Primary Metric */
    .hero-metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .metric-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }

    .metric-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }

    .metric-unit {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    /* Next Birthday Progress */
    .next-bday-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bday-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
    }

    .bday-title {
      color: var(--text-muted);
      font-weight: 600;
    }

    .bday-countdown {
      font-weight: 700;
      color: var(--primary);
    }

    .progress-bar-bg {
      height: 6px;
      width: 100%;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 99px;
    }

    /* Secondary Specs Grid */
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .spec-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .spec-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .spec-val {
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .app-card { padding: 20px 16px; }
      .date-inputs { grid-template-columns: 1fr; }
      .hero-metric-grid { grid-template-columns: 1fr; }
      .specs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- Top Header -->
    <div class="header">
      <div class="header-title">
        <h1>Kalkulator Usia Presisi</h1>
        <p>Sistem perhitungan umur dan metrik kehidupan</p>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span> Realtime
      </div>
    </div>

    <!-- Date Input Form -->
    <div class="input-group-container">
      <label class="input-label">Masukkan Tanggal Lahir</label>
      <div class="date-inputs">
        
        <div class="field">
          <input type="number" id="dayInput" placeholder="Tgl (1-31)" min="1" max="31">
        </div>

        <div class="field">
          <select id="monthInput">
            <option value="" disabled selected>Pilih Bulan</option>
            <option value="0">Januari</option>
            <option value="1">Februari</option>
            <option value="2">Maret</option>
            <option value="3">April</option>
            <option value="4">Mei</option>
            <option value="5">Juni</option>
            <option value="6">Juli</option>
            <option value="7">Agustus</option>
            <option value="8">September</option>
            <option value="9">Oktober</option>
            <option value="10">November</option>
            <option value="11">Desember</option>
          </select>
        </div>

        <div class="field">
          <input type="number" id="yearInput" placeholder="Tahun (YYYY)" min="1900" max="2026">
        </div>

      </div>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <button class="btn-submit" onclick="processAgeCalculation()">
      Hitung Detail Usia
    </button>

    <!-- Output Dashboard -->
    <div class="dashboard" id="outputDashboard">
      
      <!-- Primary Age Metrics -->
      <div class="hero-metric-grid">
        <div class="metric-card">
          <div class="metric-num num" id="valYears">0</div>
          <div class="metric-unit">Tahun</div>
        </div>
        <div class="metric-card">
          <div class="metric-num num" id="valMonths">0</div>
          <div class="metric-unit">Bulan</div>
        </div>
        <div class="metric-card">
          <div class="metric-num num" id="valDays">0</div>
          <div class="metric-unit">Hari</div>
        </div>
      </div>

      <!-- Next Birthday Progress -->
      <div class="next-bday-box">
        <div class="bday-header">
          <span class="bday-title">Menuju Ulang Tahun Berikutnya</span>
          <span class="bday-countdown num" id="valNextBday">-</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <!-- Detailed Life Specs -->
      <div class="specs-grid">
        <div class="spec-item">
          <span class="spec-label">Hari Kelahiran</span>
          <span class="spec-val" id="valDayName">-</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Zodiak</span>
          <span class="spec-val" id="valZodiac">-</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Total Minggu</span>
          <span class="spec-val num" id="valTotalWeeks">-</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Total Hari</span>
          <span class="spec-val num" id="valTotalDays">-</span>
        </div>
      </div>

    </div>

  </div>

  <script>
    function processAgeCalculation() {
      const day = parseInt(document.getElementById('dayInput').value);
      const month = parseInt(document.getElementById('monthInput').value);
      const year = parseInt(document.getElementById('yearInput').value);

      const errorEl = document.getElementById('errorBanner');
      const dashboard = document.getElementById('outputDashboard');

      // Validation
      if (isNaN(day) || isNaN(month) || isNaN(year)) {
        showError("Lengkapi tanggal, bulan, dan tahun kelahiran.");
        return;
      }

      if (year < 1900 || year > new Date().getFullYear()) {
        showError("Masukkan tahun kelahiran yang valid.");
        return;
      }

      const birthDate = new Date(year, month, day);

      if (birthDate.getDate() !== day || birthDate.getMonth() !== month) {
        showError("Kombinasi tanggal dan bulan tidak valid.");
        return;
      }

      const today = new Date();
      if (birthDate > today) {
        showError("Tanggal lahir tidak boleh melampaui hari ini.");
        return;
      }

      hideError();

      // Core Age Logic
      let yrs = today.getFullYear() - birthDate.getFullYear();
      let mths = today.getMonth() - birthDate.getMonth();
      let dys = today.getDate() - birthDate.getDate();

      if (dys < 0) {
        mths--;
        const prevMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        dys += prevMonthLastDay;
      }

      if (mths < 0) {
        yrs--;
        mths += 12;
      }

      // Next Birthday Progress & Countdown
      let nextBday = new Date(today.getFullYear(), month, day);
      if (today > nextBday) {
        nextBday.setFullYear(today.getFullYear() + 1);
      }
      
      const diffTime = nextBday - today;
      const daysToNext = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      // Calculate progress (days passed since last bday vs total year days)
      const lastBday = new Date(nextBday.getFullYear() - 1, month, day);
      const totalYearMs = nextBday - lastBday;
      const passedMs = today - lastBday;
      const progressPercent = Math.min(100, Math.max(0, (passedMs / totalYearMs) * 100));

      // Day of Week & Zodiac
      const daysOfWeek = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const birthDayName = daysOfWeek[birthDate.getDay()];
      const zodiacSign = getZodiacSign(day, month + 1);

      // Total Metrics
      const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
      const totalWeeks = Math.floor(totalDays / 7);

      // Populate UI
      document.getElementById('valYears').textContent = yrs;
      document.getElementById('valMonths').textContent = mths;
      document.getElementById('valDays').textContent = dys;
      
      document.getElementById('valNextBday').textContent = daysToNext === 0 ? "Hari ini! 🎉" : `${daysToNext} Hari Lagi`;
      document.getElementById('progressBar').style.width = `${progressPercent.toFixed(1)}%`;

      document.getElementById('valDayName').textContent = birthDayName;
      document.getElementById('valZodiac').textContent = zodiacSign;
      document.getElementById('valTotalWeeks').textContent = totalWeeks.toLocaleString('id-ID');
      document.getElementById('valTotalDays').textContent = totalDays.toLocaleString('id-ID');

      dashboard.style.display = "flex";
    }

    function getZodiacSign(day, month) {
      const dates = [20, 19, 21, 20, 21, 21, 23, 23, 23, 23, 22, 22];
      const signs = [
        "Capricorn ♑", "Aquarius ♒", "Pisces ♓", "Aries ♈", 
        "Taurus ♉", "Gemini ♊", "Cancer ♋", "Leo ♌", 
        "Virgo ♍", "Libra ♎", "Scorpio ♏", "Sagittarius ♐"
      ];
      return (day < dates[month - 1]) ? signs[month - 1] : signs[month % 12];
    }

    function showError(msg) {
      const errorEl = document.getElementById('errorBanner');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      document.getElementById('outputDashboard').style.display = 'none';
    }

    function hideError() {
      document.getElementById('errorBanner').style.display = 'none';
    }
  </script>

</body>
</html>
